[package]
name = "rust-actix-web"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.13.0"
dotenv = "0.15.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["full"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }
